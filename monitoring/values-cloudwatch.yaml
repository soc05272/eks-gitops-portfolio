# prometheus-cloudwatch-exporter 설정.
# IRSA Role ARN은 계정 ID를 포함하므로 커밋하지 않고 설치 시 --set으로 주입:
#   helm install cloudwatch-exporter prometheus-community/prometheus-cloudwatch-exporter \
#     -n monitoring -f monitoring/values-cloudwatch.yaml \
#     --set 'serviceAccount.annotations.eks\.amazonaws\.com/role-arn'=$(terraform output -raw cloudwatch_exporter_role_arn)

serviceAccount:
  create: true
  name: cloudwatch-exporter # IRSA subjects와 일치해야 한다

# 수집 비용 참고: GetMetricData 호출당 과금이지만 지표 1개·60초 주기면 월 수십 원 수준
config: |-
  region: ap-northeast-2
  metrics:
    - aws_namespace: AWS/RDS
      aws_metric_name: CPUUtilization
      aws_dimensions: [DBInstanceIdentifier]
      aws_statistics: [Average]
      period_seconds: 60
      range_seconds: 600
      # CloudWatch 지연(수 분) 탓에 원본 타임스탬프를 붙이면 Prometheus 인스턴트
      # 쿼리(5분 룩백)에 안 잡힌다. 스크레이프 시각을 쓰도록 강제.
      set_timestamp: false

# kube-prometheus-stack의 Prometheus가 자동 발견하도록 release 레이블 부여
serviceMonitor:
  enabled: true
  labels:
    release: monitoring

resources:
  requests: {cpu: 25m, memory: 128Mi}
  limits: {memory: 256Mi}
